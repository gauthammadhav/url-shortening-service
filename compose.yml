services:
  backend:
    build:
      context: ./backend
    container_name: url-shortener-backend
    ports:
      - "8000:8000"
    env_file:
      - .env.docker
    depends_on:
      - postgres

  postgres:
    image: postgres:17
    container_name: url-shortener-postgres
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    ports:
      - "5433:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

volumes:
  postgres_data: